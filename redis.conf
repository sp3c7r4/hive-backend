# ------------------------------------------------------------------
# Redis 8 production configuration for Hive (hive-backend)
#
# Loaded by docker-compose.prod.yml (prod, post-RDS) and suitable for
# the dev container too. Hardened for the Hive workload:
#   - BullMQ queues (6), auth/session/token store, idempotency locks,
#     chat/notification/grading pub-sub
#   - AOF on (appendfsync everysec) so a container restart does not
#     wipe queue state, tokens, or session data
#   - noeviction: job data, refresh tokens and lock keys are NEVER
#     silently evicted under memory pressure
#   - loopback-only + protected mode
# ------------------------------------------------------------------

# --- Network -------------------------------------------------------
# @info - bind 0.0.0.0 INSIDE the container is required: the host publishes
# the port as 127.0.0.1:6379 -> container eth0, so Redis must listen on the
# container's external interface. The loopback-only boundary lives in the
# compose port mapping (127.0.0.1:6379:6379), not here.
#
# protected-mode no: with protected-mode yes and no password, Redis refuses
# the docker-proxy forwarded connections (their source is the bridge, not
# loopback) and the app cannot connect at all. The host-side loopback
# publish is the security boundary. Add requirepass when the app config
# supports a password (defense in depth).
bind 0.0.0.0 -::*
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# --- Process -------------------------------------------------------
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""

# --- Snapshots (RDB) ------------------------------------------------
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# --- AOF (append-only file) -----------------------------------------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# --- Persistence location -------------------------------------------
dir /data

# --- Memory ----------------------------------------------------------
# @info - Tune to the host. Backend host (t3.large, 8GB) shares memory
# with the API, BullMQ workers, and Chromium renders. 4GB reserves the
# rest for the app; raise only with host memory headroom.
maxmemory 4gb
maxmemory-policy noeviction

# --- Safety ----------------------------------------------------------
maxclients 10000
maxmemory-samples 5
latency-monitor-threshold 0
notify-keyspace-events ""
