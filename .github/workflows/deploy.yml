# ------------------------------------------------------------------
# Hive Backend — deploy to EC2 via SSM (no SSH, no port 22)
#
# Build in CI -> upload tarball + env to S3 -> aws ssm send-command
# runs the install script on the box (agent already provisioned).
#
# Secrets required:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY   (hive-ci user — same as infra)
#   BACKEND_ENV        full .env.production contents
# ------------------------------------------------------------------
name: Deploy Hive Backend

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "build.ts"
      - "ecosystem.config.cjs"
  workflow_dispatch: {}

env:
  S3_BUCKET: hive-backups-prod
  S3_PREFIX: deploy/hive-backend
  INSTANCE_TAG: hive-backend
  # @info - multi-line secrets via env context, NOT inline in run scripts
  BACKEND_ENV: ${{ secrets.BACKEND_ENV }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Configure AWS credentials (hive-ci)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install dependencies
        run: npm ci

      - name: Build (esbuild -> dist/)
        run: npm run build

      - name: Package artifact
        run: |
          tar -czf release.tar.gz dist package.json package-lock.json ecosystem.config.cjs docker-compose.yml
          ls -lh release.tar.gz
          # env shipped with the artifact (written fresh every deploy — no
          # write-once logic on the box)
          printf '%s\n' "$BACKEND_ENV" > env.production
          chmod 600 env.production

      - name: Upload artifact to S3
        run: |
          STAMP=$(date +%Y%m%d%H%M%S)
          aws s3 cp release.tar.gz "s3://${S3_BUCKET}/${S3_PREFIX}/${STAMP}.tar.gz" >/dev/null
          aws s3 cp env.production "s3://${S3_BUCKET}/${S3_PREFIX}/${STAMP}.env" >/dev/null
          echo "ARTIFACT_KEY=${S3_PREFIX}/${STAMP}.tar.gz" >> "$GITHUB_ENV"
          echo "ENV_KEY=${S3_PREFIX}/${STAMP}.env" >> "$GITHUB_ENV"

      - name: Deploy via SSM
        run: |
          SCRIPT='#!/bin/bash
          set -e
          cd /home/ec2-user
          aws s3 cp s3://${S3_BUCKET}/${ARTIFACT_KEY} /tmp/release.tar.gz
          aws s3 cp s3://${S3_BUCKET}/${ENV_KEY} /tmp/env.production
          rm -rf hive-backend.tmp && mkdir -p hive-backend.tmp
          tar -xzf /tmp/release.tar.gz -C hive-backend.tmp
          rm -f /tmp/release.tar.gz
          rsync -a --delete hive-backend.tmp/ /home/ec2-user/hive-backend/
          rm -rf hive-backend.tmp
          cp /tmp/env.production /home/ec2-user/hive-backend/.env.production
          chmod 600 /home/ec2-user/hive-backend/.env.production
          rm -f /tmp/env.production
          cd /home/ec2-user/hive-backend
          npm ci --omit=dev --ignore-scripts

          # Apply the repo-owned docker-compose.yml (Postgres + Redis + any
          # services you add). Password interpolated from the shipped env.
          mkdir -p /opt/hive-db
          cp docker-compose.yml /opt/hive-db/docker-compose.yml
          PG_PW=$(grep -oP '^POSTGRES_PASSWORD=\K.*' .env.production | head -1)
          echo "POSTGRES_PASSWORD=${PG_PW}" > /opt/hive-db/.env
          chmod 600 /opt/hive-db/.env
          cd /opt/hive-db && docker compose up -d
          cd /home/ec2-user/hive-backend

          NODE_ENV=production node ./dist/migrate.js
          export PATH="$PATH:$(npm config get prefix 2>/dev/null)/bin"
          pm2 startOrReload ecosystem.config.cjs || pm2 start ecosystem.config.cjs
          pm2 startup systemd -u ec2-user --hp /home/ec2-user >/dev/null 2>&1 || true
          pm2 save >/dev/null 2>&1 || true
          sleep 3
          pm2 status'

          B64=$(printf '%s' "$SCRIPT" | base64 -w0)
          CMD_ID=$(aws ssm send-command --targets "Key=tag:Name,Values=${INSTANCE_TAG}" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"S3_BUCKET=${S3_BUCKET} ARTIFACT_KEY=${ARTIFACT_KEY} ENV_KEY=${ENV_KEY} bash -c \\\"echo ${B64} | base64 -d > /tmp/hive-deploy.sh && bash /tmp/hive-deploy.sh\\\"\"]}" \
            --query "Command.CommandId" --output text)

          echo "SSM command: $CMD_ID"
          TARGET_ID=""
          for i in $(seq 1 30); do
            TARGET_ID=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query "CommandInvocations[0].InstanceId" --output text 2>/dev/null)
            [ -n "$TARGET_ID" ] && [ "$TARGET_ID" != "None" ] && break
            sleep 2
          done
          [ -n "$TARGET_ID" ] && [ "$TARGET_ID" != "None" ] || { echo "no instance matched tag ${INSTANCE_TAG}"; exit 1; }

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$TARGET_ID" --query "Status" --output text)
            case "$STATUS" in
              Success) echo "Deploy OK"; exit 0 ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$TARGET_ID" \
                  --query "StandardErrorContent" --output text | tail -40
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Deploy timed out"; exit 1
