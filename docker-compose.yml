# ------------------------------------------------------------------
# Hive backend infra containers (managed by the deploy pipeline)
#
# THIS FILE IS OWNED BY THE REPO — edit it, push, and the deploy
# workflow applies it with `docker compose up -d` on the backend box.
# Only Postgres 18 + Redis 8 for now; add services freely.
#
# Secrets: ${POSTGRES_PASSWORD} is interpolated from /opt/hive-db/.env,
# which the deploy script writes from the shipped .env.production.
# Both services bind to 127.0.0.1 ONLY — never reachable externally.
# ------------------------------------------------------------------
services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: hive-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=hive
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # @info - postgres:18+ requires the mount at /var/lib/postgresql
      # (major-version subdirs); mounting /var/lib/postgresql/data makes
      # the container exit(1) with "unused mount/volume" (2026-09-01).
      - hive-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hive"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: hive-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - hive-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hive-pg:
  hive-redis:
